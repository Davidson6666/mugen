<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F53C17" />
    <title>Ruptura Arena</title>
    <style>
      html, body { margin: 0; background: #0a0a0c; }
      .boot { position: fixed; inset: 0; display: grid; place-items: center; background: #0a0a0c; }
      .boot__diamond {
        width: 46px; height: 46px; background: #fbd409; border: 5px solid #0a0a0c; outline: 3px solid #fff;
        animation: boot-spin 1.1s cubic-bezier(0.6, 0, 0.3, 1) infinite;
      }
      @keyframes boot-spin {
        from { transform: rotate(45deg) scale(1); }
        50% { transform: rotate(225deg) scale(0.8); }
        to { transform: rotate(405deg) scale(1); }
      }
      @media (prefers-reduced-motion: reduce) { .boot__diamond { animation: none; transform: rotate(45deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Aparece enquanto o JavaScript carrega; o React troca por inteiro ao montar. -->
      <div class="boot" aria-label="Carregando">
        <i class="boot__diamond"></i>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
